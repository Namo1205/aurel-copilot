# Calls the desk's scheduled mailbox check so policy questions and the fixed
# templates are answered even when no desk tab is open. Free on GitHub Actions.
#
# Best effort only. GitHub runs schedules when it has capacity: measured on this
# repository, one run in five hours. The primary trigger is an external pinger
# (see README, "Replies with no desk tab open"); this workflow is a free extra.
#
# Repository secrets needed (Settings -> Secrets and variables -> Actions):
#   DESK_URL     e.g. https://aurel-copilot.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel
#
# GitHub runs schedules on the default branch only and pauses them on public
# repositories after 60 days without a commit. Minute 1 rather than 0: GitHub drops
# more runs at the top of the hour.
name: Poll the desk mailbox

on:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the scheduled check
        env:
          DESK_URL: ${{ secrets.DESK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DESK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the DESK_URL and CRON_SECRET repository secrets."; exit 1
          fi
          curl --fail-with-body -sS --max-time 100 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DESK_URL/api/cron/poll"
